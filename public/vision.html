<!DOCTYPE html>
<!-- Majin — Vision overlay. A real always-on-top floating pill, not a chat window.
     Hosted two ways:
       • Desktop (Electron): the OS window is transparent + frameless + screen-saver
         always-on-top, so ONLY the pill and the answer card are visible and the space
         around them is click-through to whatever is underneath.
       • Browser: this page is injected into a Document Picture-in-Picture window
         (see js/app.js openVisionOverlay) — a borderless window that floats above
         every other app. html[data-pip] switches the page from transparent to an
         opaque dark backdrop so the floating window reads as the pill itself.
     All behaviour lives in js/vision.js (CSP disallows inline scripts). -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Majin Vision</title>

  <link rel="stylesheet" href="vendor/inter/inter.css" />
  <link rel="stylesheet" href="vendor/highlight/atom-one-dark.min.css" />
  <script src="vendor/lucide.min.js?v=29"></script>
  <script src="vendor/marked.min.js?v=29"></script>
  <script src="vendor/purify.min.js?v=29"></script>
  <script src="js/vision.js?v=36" defer></script>

  <style>
    :root {
      --s1:#0d1420; --s2:#121a27; --s3:#1a2434; --s4:#233047;
      --hair:rgba(148,163,184,.16); --hair-strong:rgba(148,163,184,.28);
      --text:#e6edf6; --text-2:#9fb0c8; --text-3:#6b7c95;
      --accent:#6366f1; --accent-2:#22d3ee; --on-accent:#04121b;
      --grad:linear-gradient(135deg,#6366f1,#22d3ee);
      --err:#f43f5e; --live:#f43f5e;
      --radius:16px;
      --shadow:0 18px 48px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
      --font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    html[data-theme="light"] {
      --s1:#ffffff; --s2:#f4f7fb; --s3:#e9eff6; --s4:#dbe4ef;
      --hair:rgba(15,23,42,.12); --hair-strong:rgba(15,23,42,.2);
      --text:#0f1b2d; --text-2:#41526b; --text-3:#6b7c95;
      --shadow:0 18px 48px rgba(30,41,59,.28);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: transparent; }
    body { font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--text); overflow: hidden; }
    /* In a browser Picture-in-Picture window we can't be transparent, so paint the
       whole floating window a deep ink that matches the pill. */
    html[data-pip] body { background: #0a0f1a; }

    /* The widget is pinned to the bottom; the space above stays transparent (Electron)
       or dark-but-inert (PiP). */
    .vroot {
      position: fixed; left: 10px; right: 10px; bottom: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    html[data-pip] .vroot { left: 0; right: 0; bottom: 0; padding: 8px; }

    /* Answer card — appears above the bar only when there is something to show. */
    .vlog {
      align-self: stretch; max-height: 300px; overflow-y: auto; overflow-x: hidden;
      background: var(--s1); border: none;
      border-radius: var(--radius); box-shadow: 0 6px 18px rgba(0,0,0,.32);
      padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
      -webkit-app-region: no-drag;
    }
    .vlog[hidden] { display: none; }
    .vline { font-size: 13px; line-height: 1.55; }
    .vline .who { font-weight: 700; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); margin-bottom: 2px; }
    .vline.you .who { color: var(--accent-2); }
    .vline.ai .who { color: #a5b4fc; }
    .vline.sys { color: var(--text-3); font-size: 11.5px; font-family: var(--mono); }
    .vline img { max-width: 100%; border-radius: 8px; border: 1px solid var(--hair); margin-top: 4px; display: block; }
    .vbody { color: var(--text); overflow-wrap: anywhere; }
    .vbody p { margin: 0 0 6px; } .vbody p:last-child { margin-bottom: 0; }
    .vbody ul, .vbody ol { margin: 0 0 6px; padding-left: 18px; }
    .vbody code { font-family: var(--mono); background: var(--s3); padding: 1px 5px; border-radius: 6px; font-size: 12px; }
    .vbody pre { background: #050810; border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px; overflow: auto; font-size: 12px; }
    .vbody pre code { background: transparent; padding: 0; }

    /* ---------- the pill ---------- */
    .vbar {
      display: flex; flex-direction: column; gap: 10px; padding: 10px 12px;
      background: rgba(15,22,34,.97); border: none;
      border-radius: 20px; box-shadow: 0 6px 18px rgba(0,0,0,.32);
      -webkit-app-region: drag;   /* drag the frameless window by the pill */
    }
    html[data-theme="light"] .vbar { background: rgba(255,255,255,.97); }

    .vhead { display: flex; align-items: center; gap: 10px; }
    .vthumb {
      width: 30px; height: 22px; flex: 0 0 auto; border-radius: 6px; background: #000;
      object-fit: cover; border: 1px solid var(--hair); display: none;
      -webkit-app-region: no-drag;
    }
    .vroot.sharing .vthumb { display: block; }
    .vmon {
      width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px; display: inline-flex;
      align-items: center; justify-content: center; background: var(--s3); color: var(--text-2);
      border: 1px solid var(--hair);
    }
    .vmon svg { width: 16px; height: 16px; }
    .vroot.sharing .vmon { background: rgba(99,102,241,.18); color: #c7d2fe; border-color: rgba(99,102,241,.5); }
    .vhead-txt { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; }
    .vtitle { font-size: 13.5px; font-weight: 650; color: var(--text); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vsub { font-size: 11px; color: var(--text-3); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vroot.sharing .vsub { color: #fca5b5; }

    .vpill {
      flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      height: 32px; padding: 0 15px; border-radius: 9999px; font: inherit; font-size: 12.5px; font-weight: 650;
      color: var(--on-accent); background: var(--grad); border: 1px solid transparent;
      transition: filter .15s ease, background .15s ease, color .15s ease;
      -webkit-app-region: no-drag;
    }
    .vpill:hover { filter: brightness(1.08); }
    .vpill svg { width: 15px; height: 15px; }
    .vroot.sharing .vpill {
      background: transparent; color: var(--text); border-color: var(--hair-strong);
    }
    .vroot.sharing .vpill:hover { background: rgba(244,63,94,.14); color: #fda4af; border-color: rgba(244,63,94,.5); }

    .vrow { display: flex; align-items: center; gap: 8px; }
    .vin {
      flex: 1 1 auto; min-width: 0; height: 40px; background: rgba(255,255,255,.05); color: var(--text);
      border: 1px solid var(--hair); border-radius: 12px; padding: 0 13px;
      font-size: 13.5px; font-family: var(--font); outline: none; -webkit-app-region: no-drag;
    }
    html[data-theme="light"] .vin { background: var(--s2); }
    .vin:focus { border-color: var(--accent-2); }
    .vin::placeholder { color: var(--text-3); }
    .vin[disabled] { opacity: .6; }

    .vc {
      flex: 0 0 auto; position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      background: rgba(255,255,255,.05); color: var(--text-2); border: 1px solid var(--hair);
      font-family: inherit; transition: background .15s ease, color .15s ease, box-shadow .15s ease;
      -webkit-app-region: no-drag;
    }
    html[data-theme="light"] .vc { background: var(--s2); }
    .vc svg { width: 18px; height: 18px; }
    .vc:hover { background: var(--s4); color: var(--text); }
    .vc.send { background: var(--grad); color: var(--on-accent); border-color: transparent; }
    .vc.send:hover { filter: brightness(1.08); color: var(--on-accent); }
    .vc[disabled] { opacity: .5; cursor: default; }
    /* active glow rings, like the reference */
    .vc.live {
      color: #c7d2fe; border-color: rgba(99,102,241,.6);
      box-shadow: 0 0 0 3px rgba(99,102,241,.18), 0 0 18px rgba(99,102,241,.35);
    }
    .vc.listening {
      color: #fda4af; border-color: rgba(244,63,94,.6);
      box-shadow: 0 0 0 3px rgba(244,63,94,.18), 0 0 18px rgba(244,63,94,.4);
      animation: vglow 1.4s ease-in-out infinite;
    }
    .vc.close:hover { background: rgba(244,63,94,.18); color: #fda4af; border-color: rgba(244,63,94,.5); }
    @keyframes vglow { 0%,100% { box-shadow: 0 0 0 3px rgba(244,63,94,.18), 0 0 14px rgba(244,63,94,.3); } 50% { box-shadow: 0 0 0 4px rgba(244,63,94,.24), 0 0 22px rgba(244,63,94,.5); } }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--s4); }
    @media (prefers-reduced-motion: reduce) { .vc.listening { animation: none !important; } }
  </style>
</head>
<body>
  <div class="vroot" id="vroot">
    <div class="vlog" id="vlog" hidden></div>
    <div class="vbar" id="vbar">
      <div class="vhead">
        <video class="vthumb" id="vthumb" autoplay muted playsinline></video>
        <span class="vmon"><i data-lucide="monitor"></i></span>
        <span class="vhead-txt">
          <span class="vtitle" id="vtitle">Majin Vision</span>
          <span class="vsub" id="vsub">Not sharing your screen</span>
        </span>
        <button type="button" class="vpill" id="vshare" title="Share your screen">
          <i data-lucide="screen-share"></i><span id="vshareLabel">Share</span>
        </button>
      </div>
      <div class="vrow">
        <button type="button" class="vc close" id="vclose" title="Close"><i data-lucide="x"></i></button>
        <input id="vin" class="vin" type="text" placeholder="Ask about your screen…  type or tap the mic" autocomplete="off" spellcheck="false" aria-label="Ask about your screen" />
        <button type="button" class="vc see" id="vsee" title="Majin can see your screen" aria-disabled="true"><i data-lucide="scan-eye"></i></button>
        <button type="button" class="vc mic" id="vmic" title="Talk to Majin"><i data-lucide="mic"></i></button>
        <button type="button" class="vc send" id="vsend" title="Send  (Enter)"><i data-lucide="arrow-up"></i></button>
      </div>
    </div>
  </div>
</body>
</html>
