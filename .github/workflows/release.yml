# Majin — release pipeline.
# Push a version tag (e.g. v2.1.0) and this builds the Windows installer, uploads
# the installer + latest.yml to a GitHub Release, and that release becomes the
# update feed every installed Majin checks on launch. No manual clicking, no FTP.
#
# owner/repo for the updater are taken from the repo this workflow runs in, so the
# app always points at the right place without you editing any config.
name: Release

on:
  push:
    tags:
      - 'v*'          # any tag like v1.0.0, v2.1.3 triggers a release build

# GITHUB_TOKEN lets electron-builder create the Release and upload assets.
permissions:
  contents: write

jobs:
  build-windows:
    name: Build & publish Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The publish config omits owner/repo on purpose. Fill them in from wherever
      # this repo actually lives so the baked-in app-update.yml is always correct.
      - name: Point the updater at this repository
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const r=(process.env.GITHUB_REPOSITORY||'').split('/');if(r.length===2){p.build.publish=p.build.publish||[];if(!p.build.publish[0])p.build.publish[0]={provider:'github'};p.build.publish[0].owner=r[0];p.build.publish[0].repo=r[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('Publishing to '+r[0]+'/'+r[1]);}"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build installer and publish GitHub Release
        # --publish always = build, create/refresh the release for this tag, upload assets.
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
